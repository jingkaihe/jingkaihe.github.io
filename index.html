<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jingkai He</title>
<meta name="description" content="Jingkai He&rsquo;s personal website.">
<meta property="og:title" content="Jingkai He">
<meta property="og:description" content="Jingkai He&rsquo;s personal website.">
<meta name="theme-color" content="#efeae0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<link rel="preload" href="assets/fonts/newsreader-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css">
<script type="module" src="assets/js/main.js"></script>
</head>
<body>
<div class="page">
  <header class="masthead">
    <h1 class="name"><span id="about-open" role="button" tabindex="0" aria-haspopup="dialog">Jingkai He</span></h1>
  </header>

  <main>
    <figure class="work">
      <div class="frame">
        <div class="canvas" id="painting" role="img" aria-label="A painting of Eden Dock at Canary Wharf.">
          <canvas id="paint"></canvas>
          <canvas id="live"></canvas>
          <noscript><p class="nojs">This picture is painted by JavaScript, which is switched off in your browser.</p></noscript>
        </div>
      </div>
      <figcaption class="title"><cite id="title">Eden Dock</cite></figcaption>
    </figure>

    <!-- Each button names the current place, season or weather; a click moves on to the next. -->
    <div class="conditions" id="conditions" role="group" aria-label="Place, season and weather of the painting">
      <button type="button" name="place" aria-label="Place">Eden Dock</button>
      <button type="button" name="season" aria-label="Season">Spring</button>
      <button type="button" name="weather" aria-label="Weather">Sunny</button>
    </div>
  </main>
</div>
<!-- A word now and then: what the cheat is up to. -->
<p class="notice" id="notice" role="status" aria-live="polite"></p>
<!-- The back of the postcard: opened from the name in the masthead. -->
<dialog class="postcard" id="about" aria-labelledby="about-name">
  <div class="card">
    <div class="message">
      <h2 id="about-name" tabindex="-1" autofocus>Jingkai He</h2>
      <p>I build software and love computers.</p>
      <p>I&rsquo;ve worked in the finance, media and gaming industries for the past decade.</p>
      <p>Currently based in London.</p>
    </div>
    <div class="address">
      <div class="postage" aria-hidden="true">
        <span class="stamp-edge"><span class="stamp"><canvas id="stamp" width="168" height="216"></canvas></span></span>
      </div>
      <p class="for">You might know me for</p>
      <ul class="lines">
        <li><a href="https://github.com/jingkaihe/kodelet">Kodelet</a></li>
        <li><a href="https://github.com/jingkaihe/matchlock">Matchlock</a></li>
        <li>Follow me as <a href="https://x.com/he_jingkai">@he_jingkai</a> on X</li>
        <li>Read my posts at <a href="https://til.jingkaihe.com">TIL</a></li>
      </ul>
    </div>
  </div>
  <button type="button" class="close" id="about-close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
</dialog>
</body>
</html>
