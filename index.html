<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jingkai He</title>
<meta name="description" content="Eden Dock, Canary Wharf, painted stroke by stroke in the browser each time you visit.">
<meta property="og:title" content="Jingkai He">
<meta property="og:description" content="Eden Dock, Canary Wharf, painted in the browser each time you visit.">
<meta name="theme-color" content="#efeae0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23cf3a22'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/newsreader-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css">
<script type="module" src="assets/js/main.js"></script>
</head>
<body>
<div class="page">
  <header class="masthead">
    <h1 class="name">Jingkai He</h1>
    <nav aria-label="Elsewhere">
      <a href="https://github.com/jingkaihe">GitHub</a>
      <a href="https://til.jingkaihe.com">TIL</a>
      <a href="https://x.com/he_jingkai">X</a>
    </nav>
  </header>

  <main>
    <figure class="work">
      <div class="frame">
        <div class="canvas" id="painting" role="img" aria-label="A painting of Eden Dock at Canary Wharf.">
          <canvas id="paint"></canvas>
          <canvas id="live"></canvas>
          <noscript><p class="nojs">This picture is painted by JavaScript, which is switched off in your browser.</p></noscript>
        </div>
      </div>
      <figcaption class="title"><cite id="title">Eden Dock</cite></figcaption>
    </figure>

    <!-- Each button shows the current season or weather; a click moves on to the next. -->
    <div class="conditions" id="conditions" role="group" aria-label="Season and weather of the painting">
      <button type="button" name="season" aria-label="Season"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-spring"/></svg></button>
      <button type="button" name="weather" aria-label="Weather"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sunny"/></svg></button>
    </div>
    <svg class="sprite" width="0" height="0" aria-hidden="true">
      <symbol id="i-spring" viewBox="0 0 24 24"><path d="M12 21v-9M12 14c-4.5 0-7-2.2-7-6 4.5 0 7 2.2 7 6zM12 11c0-3.8 2.5-6 7-6 0 3.8-2.5 6-7 6z"/></symbol>
      <symbol id="i-summer" viewBox="0 0 24 24"><circle cx="12" cy="9.5" r="6.5"/><path d="M12 21v-9M12 13.5l2.6-2.6M12 10.8L9.7 8.5"/></symbol>
      <symbol id="i-autumn" viewBox="0 0 24 24"><path transform="rotate(35 12 12)" d="M12 3.5c3.6 2.6 5.5 5.6 5.5 8.7a5.5 5.5 0 0 1-11 0c0-3.1 1.9-6.1 5.5-8.7zM12 8.5V21"/></symbol>
      <symbol id="i-winter" viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9M9.6 4.8L12 7.2l2.4-2.4M9.6 19.2l2.4-2.4 2.4 2.4"/></symbol>
      <symbol id="i-sunny" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></symbol>
      <symbol id="i-cloudy" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.96A5.5 5.5 0 0 0 7.1 9.1 4.5 4.5 0 0 0 7 18z"/></symbol>
      <symbol id="i-fog" viewBox="0 0 24 24"><path transform="translate(0 -3.5)" d="M7 18h10a4 4 0 0 0 .6-7.96A5.5 5.5 0 0 0 7.1 9.1 4.5 4.5 0 0 0 7 18z"/><path d="M5.5 18h13M8.5 21h7"/></symbol>
      <symbol id="i-rain" viewBox="0 0 24 24"><path transform="translate(0 -3.5)" d="M7 18h10a4 4 0 0 0 .6-7.96A5.5 5.5 0 0 0 7.1 9.1 4.5 4.5 0 0 0 7 18z"/><path d="M8.6 17.6l-1 3.2M12.6 17.6l-1 3.2M16.6 17.6l-1 3.2"/></symbol>
    </svg>
  </main>
</div>
</body>
</html>
